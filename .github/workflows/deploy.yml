name: Build and Test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'env to run'
        required: false
        default: 'dev'
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: gradle build

      - name: Run tests
        run: gradle test
